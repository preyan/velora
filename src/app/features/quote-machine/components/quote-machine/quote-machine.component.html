<app-quote-display [quote]="quoteService.currentQuote()"></app-quote-display>

<div class="controls">
  <button class="control-btn" (click)="previous()" aria-label="Previous quote">
    ← Prev
  </button>
  <button class="control-btn" (click)="next()" aria-label="Next quote">
    Next →
  </button>
</div>
