<app-background></app-background>

<app-quote-display [quote]="quoteService.currentQuote()"></app-quote-display>

<div class="controls">
  <div class="controls-quote">
    <button class="control-btn" data-testid="btn-prev" (click)="previous()" aria-label="Previous quote">
      ← Prev
    </button>
    <button class="control-btn" data-testid="btn-next" (click)="next()" aria-label="Next quote">
      Next →
    </button>
  </div>
  <app-controls></app-controls>
</div>
