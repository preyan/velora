@if (quote) {
  <div class="quote-display">
    <app-quote-text [text]="quote.text"></app-quote-text>
    <app-quote-author [author]="quote.author"></app-quote-author>
    <button class="favorite-btn" (click)="toggleFavorite()" [class.favorited]="favoritesService.isFavorited()">
      {{ favoritesService.isFavorited() ? '❤️' : '🤍' }}
    </button>
  </div>
}
